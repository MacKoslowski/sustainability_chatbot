[project]
name = "rva-chat"
version = "0.1.0"
description = "RAG chatbot for Richmond, VA sustainability questions, built for a small local LLM."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "rank-bm25>=0.2.2",
    "requests>=2.31",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
